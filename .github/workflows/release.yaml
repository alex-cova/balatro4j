name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Build and test
        run: ./gradlew build -Pversion=${{ github.ref_name }}

      - name: Publish to GitHub Packages
        run: ./gradlew :perkeo:publishMavenPublicationToGithubRepository -Pversion=${{ github.ref_name }}
        env:
          MAVEN_USER: ${{ github.actor }}
          MAVEN_SECRET: ${{ secrets.GITHUB_TOKEN }}
